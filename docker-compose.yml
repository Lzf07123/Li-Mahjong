name: mahjong-score

services:
  mahjong:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APT_MIRROR: ${APT_MIRROR:-}
    image: mahjong-score:latest
    container_name: mahjong-score
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-admin123}
    volumes:
      - mahjong_data:/data
    restart: unless-stopped

volumes:
  mahjong_data:
